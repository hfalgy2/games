# نبض دوري لإبقاء مشروع Supabase نشطاً (يمنع الإيقاف بسبب الخمول)
# يشتغل تلقائياً كل يومين، ويمكن تشغيله يدوياً من تبويب Actions
name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 */2 * *"   # كل يومين الساعة 6 صباحاً UTC
  workflow_dispatch:          # زر تشغيل يدوي

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          echo "Sending heartbeat to Supabase..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/wedding_locks?select=owner&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 400 ]; then
            echo "Heartbeat OK ✓"
          else
            echo "Heartbeat failed"; exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
