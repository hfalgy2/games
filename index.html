<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

    --purple:#7c4dff; --purple-deep:#5e35d6;
    --coral:#ff6f91; --coral-soft:#ff9eb5;
    --sunny:#ffc24b; --sunny-light:#ffd98a;
    --mint:#3ec7b0;
    --ink:#3a2a5c; --ink-soft:#6b5b8a;
    --paper:#fffdfa; --lav-bg:#f3ecff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,111,145,0.22), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(255,194,75,0.22), transparent 42%),
      radial-gradient(circle at 50% 108%, rgba(124,77,255,0.24), transparent 55%),
      var(--lav-bg);
    color:var(--ink); font-family:'Readex Pro', sans-serif;
    padding:0 18px; overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
  }
  .blob{ position:fixed; border-radius:50%; filter:blur(2px); opacity:.5; pointer-events:none; z-index:0; }
  .blob.b1{ width:90px; height:90px; background:var(--coral-soft); top:16%; left:-24px; animation:float1 7s ease-in-out infinite; }
  .blob.b2{ width:60px; height:60px; background:var(--sunny); top:60%; right:-16px; animation:float2 6s ease-in-out infinite; }
  .blob.b3{ width:46px; height:46px; background:var(--purple); bottom:8%; left:14%; opacity:.35; animation:float1 8s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
  @keyframes float2{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(16px)} }
  .wrap{ width:100%; max-width:480px; position:relative; z-index:1; padding:44px 0 60px; }

  .hero{ text-align:center; margin-bottom:24px; animation:pop .55s cubic-bezier(.34,1.56,.64,1) both; }
  .names{ font-weight:700; font-size:46px; line-height:1.1; color:var(--purple-deep); display:inline-block; }
  .names .amp{ display:block; font-size:24px; color:var(--coral); margin:2px 0; }

  /* التبويبات */
  .tabbar{ display:flex; gap:8px; justify-content:center; margin-bottom:28px; }
  .tab{ font-family:'Readex Pro',sans-serif; font-weight:600; font-size:15px; color:var(--ink-soft);
    background:var(--paper); border:1.5px solid rgba(124,77,255,.2); border-radius:30px;
    padding:11px 30px; cursor:pointer; box-shadow:0 4px 12px rgba(124,77,255,.1); transition:all .2s ease; }
  .tab.active{ background:linear-gradient(135deg,var(--coral),var(--purple)); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(255,111,145,.3); }

  .panel{ display:none; animation:fade .4s ease both; }
  .panel.show{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* شبكة الألعاب */
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .tile{ position:relative; aspect-ratio:1/1; border-radius:26px; text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; overflow:hidden; isolation:isolate; box-shadow:0 14px 30px rgba(124,77,255,.22); transition:transform .2s cubic-bezier(.34,1.56,.64,1); animation:pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .tile:active{ transform:scale(.95); }
  .tile:nth-child(1){ animation-delay:.05s; background:linear-gradient(150deg, var(--coral), var(--purple)); }
  .tile:nth-child(2){ animation-delay:.12s; background:linear-gradient(150deg, var(--sunny), var(--coral)); }
  .tile:nth-child(3){ animation-delay:.19s; background:linear-gradient(150deg, var(--mint), var(--purple)); }
  .tile:nth-child(4){ animation-delay:.26s; background:linear-gradient(150deg, var(--purple), var(--coral)); }
  .tile .num{ font-weight:700; font-size:64px; line-height:1; text-shadow:0 4px 14px rgba(0,0,0,.15); }
  .tile .glyph{ position:absolute; font-size:120px; opacity:.14; bottom:-24px; left:-10px; transform:rotate(-12deg); }
  .tile .go{ font-size:13px; font-weight:600; background:rgba(255,255,255,.25); padding:6px 16px; border-radius:30px; backdrop-filter:blur(4px); }
  .tile.add{ background:var(--paper); color:var(--ink-soft); border:2px dashed rgba(124,77,255,.3); box-shadow:none; }
  .tile.add .plus{ font-size:44px; line-height:1; color:var(--purple); }
  .tile.add .lbl{ font-size:13px; font-weight:500; }

  /* الألبوم — عدّاد حي */
  .album-intro{ text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:24px; line-height:1.7; }
  .cnode{ background:var(--paper); border-radius:20px; padding:20px 22px; margin-bottom:16px; position:relative; overflow:hidden;

    animation:pop .55s cubic-bezier(.34,1.56,.64,1) both; }
  .cnode::before{ content:""; position:absolute; top:0; right:0; bottom:0; width:6px; }
  .c1::before{ background:linear-gradient(var(--coral),var(--coral-soft)); }
  .c2::before{ background:linear-gradient(var(--sunny),var(--sunny-light)); }
  .c3::before{ background:linear-gradient(var(--mint),#7effe0); }
  .c4::before{ background:linear-gradient(var(--purple),#c9b3ff); }
  .cnode:nth-child(1){animation-delay:.05s;} .cnode:nth-child(2){animation-delay:.13s;}
  .cnode:nth-child(3){animation-delay:.21s;} .cnode:nth-child(4){animation-delay:.29s;}

  .cemoji{ flex-shrink:0; width:54px; height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .c1 .cemoji{ background:rgba(255,111,145,.14); } .c2 .cemoji{ background:rgba(255,194,75,.16); }
  .c3 .cemoji{ background:rgba(62,199,176,.16); } .c4 .cemoji{ background:rgba(124,77,255,.14); }
  .cinfo{ flex:1; }
  .cname{ font-size:18px; font-weight:700; color:var(--ink); }
  .cdate{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; direction:ltr; text-align:right; }
  .cbig{ margin-top:14px; text-align:center; }
  .cnum{ font-size:34px; font-weight:700; color:var(--purple-deep); line-height:1; direction:ltr; }

  .cnote{ font-size:12.5px; color:var(--coral); font-weight:500; margin-top:8px; text-align:center; }

  .foot{ text-align:center; margin-top:20px; color:var(--ink-soft); font-size:13.5px; opacity:.9; }

  .subtab{ font-family:'Readex Pro',sans-serif; font-weight:600; font-size:14px; color:var(--ink-soft); background:transparent; border:1.5px solid rgba(124,77,255,.25); border-radius:26px; padding:9px 22px; cursor:pointer; }
  .subtab.active{ background:var(--purple); color:#fff; border-color:transparent; }

  .lock .lt{ font-size:19px; font-weight:700; margin-bottom:6px; }

  .pin{ display:flex; gap:10px; justify-content:center; margin-bottom:8px; direction:ltr; }

  .addbtn{ width:100%; background:linear-gradient(135deg,var(--coral),var(--purple)); color:#fff; border:none; border-radius:14px; font-family:'Readex Pro'; font-weight:700; font-size:15px; padding:15px; margin-top:6px; cursor:pointer; box-shadow:0 8px 20px rgba(255,111,145,.3); }
  .wempty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:20px 0; }
  .wtools{ text-align:center; margin-top:14px; }
  .wtool{ font-family:'Readex Pro'; font-size:12px; color:var(--ink-soft); background:none; border:none; cursor:pointer; text-decoration:underline; opacity:.7; }

  /* نموذج إضافة/تعديل */
  .modal-bg{ position:fixed; inset:0; background:rgba(58,42,92,.4); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:var(--paper); border-radius:22px; padding:24px 22px; width:100%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .modal h3{ font-size:19px; font-weight:700; margin-bottom:16px; text-align:center; color:var(--purple-deep); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .field input, .field textarea{ width:100%; border:1.5px solid rgba(124,77,255,.25); border-radius:12px; padding:12px 14px; font-family:'Readex Pro'; font-size:15px; color:var(--ink); background:rgba(124,77,255,.03); }
  .field textarea{ resize:vertical; min-height:60px; }
  .modal-acts{ display:flex; gap:10px; margin-top:6px; }
  .modal-acts button{ flex:1; border:none; border-radius:12px; font-family:'Readex Pro'; font-weight:700; font-size:15px; padding:13px; cursor:pointer; }
  .m-save{ background:linear-gradient(135deg,var(--coral),var(--purple)); color:#fff; }
  .m-cancel{ background:rgba(124,77,255,.08); color:var(--ink-soft); }

</style>

function diffParts(from, to){
  let ms = Math.abs(to - from);
  const day = 86400000;
  const days = Math.floor(ms/day);
  const years = Math.floor(days/365);
  const remDays = days - years*365;
  const months = Math.floor(remDays/30);
  const d = remDays - months*30;
  return { years, months, days:d, totalDays:days };
}

function buildCounters(){

      dateHtml = "— — —";
      bigHtml = `<div class="cnum" style="font-size:22px;">بانتظاره ✨</div>`;
    } else {
      const p = diffParts(m.date, now);
      dateHtml = `${m.date.getDate()}-${m.date.getMonth()+1}-${m.date.getFullYear()}`;
      let parts = [];
      if(p.years) parts.push(`${p.years} سنة`);
      if(p.months) parts.push(`${p.months} شهر`);
      parts.push(`${p.days} يوم`);
      const isFuture = m.date > now;

      bigHtml = `<div class="cnum">${p.totalDays}</div><div class="cunit">${word} · ${parts.join(" و ")}</div>`;

        </div>
      </div>
      <div class="cbig">${bigHtml}</div>
      <div class="cnote">${m.note}</div>`;
    box.appendChild(node);
  });
}

// ===== الجداول =====
// ---- أدوات التشفير (Web Crypto) ----
const enc = new TextEncoder();
const dec = new TextDecoder();
function buf2b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b642buf(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }

// تجزئة الرقم السري (SHA-256 مع ملح) — لا يُخزَّن الرقم نفسه
async function hashPin(pin, saltB64){
  const salt = saltB64 ? b642buf(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const material = enc.encode(pin);
  const combined = new Uint8Array(salt.length + material.length);
  combined.set(salt); combined.set(material, salt.length);
  const digest = await crypto.subtle.digest("SHA-256", combined);
  return { hash: buf2b64(digest), salt: buf2b64(salt) };
}

// اشتقاق مفتاح تشفير من الرقم السري (PBKDF2)
async function deriveKey(pin, saltB64){
  const salt = b642buf(saltB64);
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:100000, hash:"SHA-256" },
    baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encryptObj(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
  return buf2b64(iv) + ":" + buf2b64(ct);
}
async function decryptObj(key, blob){
  try{
    const [ivB64, ctB64] = blob.split(":");
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b642buf(ivB64) }, key, b642buf(ctB64));
    return JSON.parse(dec.decode(pt));
  }catch(e){ return null; }
}

async function wFetchLock(owner){
  if(!wdb) return null;
  const { data } = await wdb.from("wedding_locks").select("pin_hash, salt").eq("owner", owner).maybeSingle();
  return data || null;
}
async function wSetLock(owner, pin_hash, salt){
  await wdb.from("wedding_locks").upsert({ owner, pin_hash, salt }, { onConflict:"owner" });
}
async function wFetchItems(owner){
  if(!wdb) return [];
  const { data } = await wdb.from("wedding_items").select("*").eq("owner", owner).order("sort",{ascending:true}).order("id",{ascending:true});
  if(!data) return [];
  // فك التشفير بمفتاح المالك
  const key = cryptoKey[owner];
  const out = [];
  for(const row of data){
    const obj = await decryptObj(key, row.data);
    if(obj) out.push({ id:row.id, ...obj });
  }
  return out;
}
async function wAddItem(owner, it){
  const blob = await encryptObj(cryptoKey[owner], { name:it.name, total:it.total, paid:it.paid, note:it.note });
  const { data } = await wdb.from("wedding_items").insert({ owner, data:blob, sort:Date.now()%100000 }).select().maybeSingle();
  return data;
}
async function wUpdateItem(owner, id, it){
  const blob = await encryptObj(cryptoKey[owner], { name:it.name, total:it.total, paid:it.paid, note:it.note });
  await wdb.from("wedding_items").update({ data:blob }).eq("id", id);
}
async function wDeleteItem(id){
  await wdb.from("wedding_items").delete().eq("id", id);
}

function statusOf(it){
  const t=Number(it.total)||0, p=Number(it.paid)||0;
  if(p<=0) return {cls:"st-none", badge:"b-none", label:"ما دُفع"};
  if(p>=t) return {cls:"st-full", badge:"b-full", label:"مدفوع كامل"};
  return {cls:"st-partial", badge:"b-partial", label:"عربون"};
}

function renderWedding(){
  if(!wdb){ wbody.innerHTML = `<div class="wempty">تعذّر الاتصال بقاعدة البيانات. حدّث الصفحة.</div>`; return; }
  if(!unlocked[currentOwner]){ renderLock(); return; }
  renderTable();
}

function renderLock(){
  pinBuffer = "";
  const o = OWNERS[currentOwner];
  wbody.innerHTML = `
    <div class="lock">
      <div class="ic">🔒</div>
      <div class="lt">${o.label}</div>
      <div class="ls" id="lockSub">أدخل الرقم السري (٤ أرقام)</div>
      <div class="pin" id="pinRow"></div>
      <div class="lockerr" id="lockErr"></div>
      <div class="keypad" id="keypad"></div>
    </div>`;
  drawPins();
  const kp = document.getElementById("keypad");
  ["1","2","3","4","5","6","7","8","9","مسح","0","⌫"].forEach(k=>{
    const btn=document.createElement("button");
    btn.className = "key" + (k==="مسح"||k==="⌫"?" wide":"");
    btn.textContent = k;
    btn.onclick = ()=>handleKey(k);
    kp.appendChild(btn);
  });
  // حدّث النص حسب وجود قفل مسبق
  wFetchLock(currentOwner).then(lock=>{
    const sub=document.getElementById("lockSub");
    if(sub) sub.textContent = lock ? "أدخل رقمك السري لفتح الجدول" : "أنشئ رقماً سرياً جديداً (٤ أرقام) — احفظه!";
  });
}
function drawPins(){
  const row=document.getElementById("pinRow"); if(!row) return;
  row.innerHTML="";
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="dot"+(i<pinBuffer.length?" filled":"");
    d.textContent = i<pinBuffer.length ? "•" : "";
    row.appendChild(d);
  }
}
function handleKey(k){
  const err=document.getElementById("lockErr"); if(err) err.textContent="";
  if(k==="⌫"){ pinBuffer=pinBuffer.slice(0,-1); drawPins(); return; }
  if(k==="مسح"){ pinBuffer=""; drawPins(); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer+=k; drawPins();
  if(pinBuffer.length===4) setTimeout(submitPin, 150);
}
async function submitPin(){
  const entered = pinBuffer;
  const err=document.getElementById("lockErr");
  const existing = await wFetchLock(currentOwner);
  if(existing===null){
    // أول مرة — أنشئ القفل (تجزئة + ملح)
    const { hash, salt } = await hashPin(entered);
    await wSetLock(currentOwner, hash, salt);
    cryptoKey[currentOwner] = await deriveKey(entered, salt);
    unlocked[currentOwner]=true;
    items[currentOwner]=await wFetchItems(currentOwner);
    renderTable();
  } else {
    // تحقّق: جزّئ المُدخل بنفس الملح وقارن
    const { hash } = await hashPin(entered, existing.salt);
    if(hash === existing.pin_hash){
      cryptoKey[currentOwner] = await deriveKey(entered, existing.salt);
      unlocked[currentOwner]=true;
      items[currentOwner]=await wFetchItems(currentOwner);
      renderTable();
    } else {
      pinBuffer="";
      drawPins();
      if(err) err.textContent="الرقم السري غير صحيح";
    }
  }
}

function renderTable(){
  const list = items[currentOwner];
  let total=0, paid=0;
  list.forEach(it=>{ total+=Number(it.total)||0; paid+=Number(it.paid)||0; });
  const left = total - paid;

  let html = `
    <div class="summary">
      <div class="sum total"><div class="v">${fmtSAR(total)}</div><div class="l">الإجمالي (ر.س)</div></div>
      <div class="sum paid"><div class="v">${fmtSAR(paid)}</div><div class="l">المدفوع</div></div>
      <div class="sum left"><div class="v">${fmtSAR(left)}</div><div class="l">المتبقّي</div></div>
    </div>`;

  // شريط الفلتر — العدّ لكل حالة
  const cnt = { all:list.length, full:0, partial:0, none:0 };
  list.forEach(it=>{
    const s=statusOf(it);
    if(s.cls==="st-full") cnt.full++;
    else if(s.cls==="st-partial") cnt.partial++;
    else cnt.none++;
  });
  html += `
    <div class="filterbar">
      <button class="fbtn ${wFilter==='all'?'active':''}" data-f="all">الكل (${cnt.all})</button>
      <button class="fbtn ${wFilter==='partial'?'active':''}" data-f="partial">عربون (${cnt.partial})</button>
      <button class="fbtn ${wFilter==='none'?'active':''}" data-f="none">ما دُفع (${cnt.none})</button>
      <button class="fbtn ${wFilter==='full'?'active':''}" data-f="full">مدفوع كامل (${cnt.full})</button>
    </div>`;

  // طبّق الفلتر على القائمة المعروضة (الملخص فوق يظل يحسب الكل)
  const shown = list.filter(it=>{
    if(wFilter==="all") return true;
    const s=statusOf(it);
    return (wFilter==="full"&&s.cls==="st-full") || (wFilter==="partial"&&s.cls==="st-partial") || (wFilter==="none"&&s.cls==="st-none");
  });

  if(list.length===0){
    html += `<div class="wempty">ما فيه بنود بعد — أضف أول بند 👇</div>`;
  } else if(shown.length===0){
    html += `<div class="wempty">ما فيه بنود بهذي الحالة</div>`;
  } else {
    shown.forEach(it=>{
      const st=statusOf(it);
      const t=Number(it.total)||0, p=Number(it.paid)||0;
      const pct = t>0 ? Math.min(100, Math.round(p/t*100)) : 0;
      const rem = t-p;
      html += `
        <div class="item ${st.cls}">
          <div class="item-top">
            <div class="item-name">${escapeHtml(it.name)}</div>
            <span class="ibadge ${st.badge}">${st.label}</span>
          </div>
          <div class="bars">
            <span>الكامل: <b>${fmtSAR(t)}</b></span>
            <span>المدفوع: <b>${fmtSAR(p)}</b></span>
            ${rem>0?`<span>باقي: <b>${fmtSAR(rem)}</b></span>`:``}
          </div>
          <div class="prog"><span style="width:${pct}%"></span></div>
          ${it.note?`<div class="inote">📝 ${escapeHtml(it.note)}</div>`:``}
          <div class="iacts">
            <button class="iact" data-edit="${it.id}">تعديل</button>
            <button class="iact del" data-del="${it.id}">حذف</button>
          </div>
        </div>`;
    });
  }
  html += `<button class="addbtn" id="addItem">+ أضف بند جديد</button>`;
  html += `<div class="wtools"><button class="wtool" id="changePin">تغيير الرقم السري 🔑</button> · <button class="wtool" id="lockAgain">قفل الجدول 🔒</button></div>`;
  wbody.innerHTML = html;

  document.getElementById("addItem").onclick = ()=>openModal(null);
  document.getElementById("lockAgain").onclick = ()=>{ unlocked[currentOwner]=false; cryptoKey[currentOwner]=null; wFilter="all"; renderLock(); };
  document.getElementById("changePin").onclick = ()=>openChangePin();
  wbody.querySelectorAll("[data-f]").forEach(b=> b.onclick=()=>{
    wFilter = b.dataset.f;
    renderTable();
  });
  wbody.querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=>{
    const it = list.find(x=>String(x.id)===b.dataset.edit); openModal(it);
  });
  wbody.querySelectorAll("[data-del]").forEach(b=> b.onclick=async ()=>{
    if(!confirm("متأكد تبي تحذف هذا البند؟")) return;
    await wDeleteItem(b.dataset.del);
    items[currentOwner]=await wFetchItems(currentOwner);
    renderTable();
  });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function openModal(it){
  const editing = !!it;
  const bg=document.createElement("div");
  bg.className="modal-bg";
  bg.innerHTML=`
    <div class="modal">
      <h3>${editing?"تعديل البند":"بند جديد"}</h3>
      <div class="field"><label>اسم البند</label><input id="f_name" value="${editing?escapeHtml(it.name):""}" placeholder="مثال: القاعة"></div>
      <div class="field"><label>المبلغ الكامل (ر.س)</label><input id="f_total" type="number" inputmode="decimal" value="${editing?it.total:""}" placeholder="0"></div>
      <div class="field"><label>المدفوع (ر.س)</label><input id="f_paid" type="number" inputmode="decimal" value="${editing?it.paid:""}" placeholder="0"></div>
      <div class="field"><label>ملاحظة (اختياري)</label><textarea id="f_note" placeholder="اسم المورد، رقم تواصل، أي تفصيل...">${editing?escapeHtml(it.note||""):""}</textarea></div>
      <div class="modal-acts">
        <button class="m-cancel" id="m_cancel">إلغاء</button>
        <button class="m-save" id="m_save">${editing?"حفظ":"إضافة"}</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#m_cancel").onclick=()=>bg.remove();
  bg.onclick=(e)=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector("#m_save").onclick=async ()=>{
    const name=bg.querySelector("#f_name").value.trim();
    const total=parseFloat(bg.querySelector("#f_total").value)||0;
    const paid=parseFloat(bg.querySelector("#f_paid").value)||0;
    const note=bg.querySelector("#f_note").value.trim();
    if(!name){ bg.querySelector("#f_name").focus(); return; }
    const payload={name,total,paid,note};
    if(editing) await wUpdateItem(currentOwner, it.id, payload);
    else await wAddItem(currentOwner, payload);
    items[currentOwner]=await wFetchItems(currentOwner);
    bg.remove();
    renderTable();
  };
}

async function openChangePin(){
  const owner = currentOwner;
  const cur = items[owner]; // البنود الحالية (مفكوكة التشفير في الذاكرة)
  const bg=document.createElement("div");
  bg.className="modal-bg";
  bg.innerHTML=`
    <div class="modal">
      <h3>تغيير الرقم السري</h3>
      <div class="field"><label>الرقم السري الجديد (٤ أرقام)</label><input id="np1" type="tel" inputmode="numeric" maxlength="4" placeholder="****"></div>
      <div class="field"><label>أعد إدخاله للتأكيد</label><input id="np2" type="tel" inputmode="numeric" maxlength="4" placeholder="****"></div>
      <div class="lockerr" id="cpErr"></div>
      <div class="modal-acts">
        <button class="m-cancel" id="cp_cancel">إلغاء</button>
        <button class="m-save" id="cp_save">حفظ</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#cp_cancel").onclick=()=>bg.remove();
  bg.onclick=(e)=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector("#cp_save").onclick=async ()=>{
    const p1=bg.querySelector("#np1").value.trim(), p2=bg.querySelector("#np2").value.trim();
    const er=bg.querySelector("#cpErr");
    if(!/^\d{4}$/.test(p1)){ er.textContent="لازم ٤ أرقام"; return; }
    if(p1!==p2){ er.textContent="الرقمان غير متطابقين"; return; }
    er.textContent="جاري التحديث...";
    // مفتاح وملح جديد
    const { hash, salt } = await hashPin(p1);
    const newKey = await deriveKey(p1, salt);
    // أعد تشفير كل البنود بالمفتاح الجديد
    const { data:rows } = await wdb.from("wedding_items").select("id").eq("owner", owner);
    for(let i=0;i<cur.length;i++){
      const it=cur[i];
      const blob = await encryptObj(newKey, { name:it.name, total:it.total, paid:it.paid, note:it.note });
      await wdb.from("wedding_items").update({ data:blob }).eq("id", it.id);
    }
    await wSetLock(owner, hash, salt);
    cryptoKey[owner]=newKey;
    bg.remove();
    alert("تم تغيير الرقم السري ✓");
  };
}

// التبويبات الفرعية للجداول
document.querySelectorAll(".subtab").forEach(st=>{
  st.onclick=()=>{
    document.querySelectorAll(".subtab").forEach(x=>x.classList.remove("active"));
    st.classList.add("active");
    currentOwner=st.dataset.owner; wFilter="all";
    renderWedding();
  };
});

// تبديل التبويبات
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"));
    t.classList.add("active");
    document.getElementById(t.dataset.tab).classList.add("show");
    if(t.dataset.tab==="wedding") renderWedding();
  };
});
</script>
</body>
</html>
